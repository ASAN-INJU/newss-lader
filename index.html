
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#246BFD">

<meta property="og:title" content="전시대 순환봉사 배정표">
<meta name="description" content="전시대 순환봉사 배정표">
<title>전시대 순환봉사 배정표</title>


<style>
*{box-sizing:border-box}
html,body,input,select,textarea,button{
  font-family:Arial,"Noto Sans KR",sans-serif;
  font-size:10pt;
}
body{margin:0;background:#f3f6fb;color:#253044}
header{background:#246bfd;color:white;text-align:center;padding:16px 8px}
header h1{font-size:10pt;margin:0 0 6px}
header p{font-size:10pt;margin:0}
main{max-width:850px;margin:auto;padding:10px}
.card{background:white;border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 2px 8px #0000000c}
h2,h3{font-size:10pt;margin:0 0 10px}
p{font-size:10pt}
.small{font-size:10pt;color:#687386;line-height:1.5}
input[type=text],select,textarea{
  padding:8px;border:1px solid #cbd5e1;border-radius:7px;
  background:white;color:#253044;min-width:0
}
textarea{width:100%;min-height:75px;resize:vertical}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:minmax(0,1fr) 75px;gap:7px;align-items:center}
.person input,.person select{width:100%;height:36px}
.session{display:flex;align-items:center;gap:9px;padding:10px;margin:7px 0;border:1px solid #dbe3ef;border-radius:9px;cursor:pointer}
.session input{width:18px;height:18px;flex-shrink:0}
.session strong{display:block;font-size:10pt}
.session small{display:block;margin-top:3px;font-size:10pt;color:#687386}
button{border:0;border-radius:8px;padding:10px;background:#246bfd;color:white;cursor:pointer}
.dark{background:#334155;color:white}
.actions{display:flex;flex-wrap:wrap;gap:7px}
.actions button{flex:1;min-width:110px}
.notice{background:#fff9e8;border:1px solid #f1df9e;border-radius:9px;padding:10px;line-height:1.7;font-size:10pt}
.table-wrap{width:100%;overflow-x:auto;margin:8px 0 18px}
table{width:100%;min-width:470px;border-collapse:collapse;font-size:10pt}
th,td{padding:7px 4px;border:1px solid #dce3ed;text-align:center;vertical-align:middle;font-size:10pt}
th{background:#edf3ff}
.tag{display:inline-block;padding:4px;border-radius:5px;background:#e8f0ff;color:#204a91;font-size:10pt}
.tag.street{background:#fff0d8;color:#8a5100}
.tag.rest{background:#f0f1f3;color:#626b79}
.member-names{display:block;margin-top:4px;overflow-wrap:anywhere;font-size:10pt;color:#536074}
.hidden{display:none!important}
#shareUrl{width:100%;margin-top:8px}
@media(max-width:430px){
  main{padding:8px}
  .card{padding:11px}
  .person{grid-template-columns:minmax(0,1fr) 70px}
}
@media print{
  body{background:white}
  header{background:white;color:black}
  .no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
</style>
</head>

<body>
<header>
<h1>전시대 순환봉사 배정표</h1>
  <p>봉사 선택 · 조별 순환 배정표</p>
</header>

<main>
  <section class="card">
    <h2>① 봉사 종류 선택</h2>
    <p class="small">참여할 봉사를 선택하세요. 여러 가지를 선택할 수 있습니다.</p>

    <label class="session">
      <input type="checkbox" id="wed" checked>
      <div><strong>수요일 저녁 봉사</strong><small>오후 6:00 ~ 8:00</small></div>
    </label>

    <label class="session">
      <input type="checkbox" id="satMorning" checked>
      <div><strong>토요일 오전 봉사</strong><small>오전 10:00 ~ 12:00</small></div>
    </label>

    <label class="session">
      <input type="checkbox" id="satEvening" checked>
      <div><strong>토요일 저녁 봉사</strong><small>오후 6:00 ~ 8:00</small></div>
    </label>
  </section>

  <section class="card">
    <h2>② 참여자 이름 및 조 선택</h2>
    <p class="small">이름을 입력하고 바로 옆에서 조를 선택하세요.</p>
    <div class="people" id="people"></div>
  </section>

  <section class="card">
    <h2>③ 공지사항</h2>
    <textarea id="notice" placeholder="공지사항을 입력하세요."></textarea>
  </section>

  <section class="card">
    <h2>④ 전체 순환봉사 배정표</h2>
    <div class="notice">
      <strong>A 전시대:</strong> 영인면사무소 앞<br>
      <strong>B 전시대:</strong> 농협 하나로마트 앞<br>
      <strong>교대 간격:</strong> 15분
    </div>
    <div id="schedule"></div>
  </section>

  <section class="card no-print">
    <h2>⑤ 저장 및 공유</h2>
    <div class="actions">
      <button type="button" id="saveBtn">내용 저장</button>
      <button type="button" id="shareBtn">공유 링크 만들기</button>
      <button type="button" class="dark" id="printBtn">배정표 인쇄</button>
    </div>
    <div id="shareArea" class="hidden">
      <h3 style="margin-top:12px">오늘의 전시대 순환봉사 배정표</h3>
      <p class="small">아래 링크를 복사하여 공유하세요.</p>
      <input type="text" id="shareUrl" readonly>
      <button type="button" id="copyBtn" style="width:100%;margin-top:8px">공유 링크 복사</button>
    </div>
    <p id="message" class="small" aria-live="polite"></p>
  </section>
</main>

<script>
(function(){
"use strict";

const STORAGE_KEY = "displayStandVolunteerAppV5";

let people = Array.from({length:12},function(){
  return {name:"",group:"1"};
});

let selected = {
  wed:true,
  satMorning:true,
  satEvening:true
};

const sessions = [
  {key:"wed",title:"수요일 저녁 봉사",start:"18:00"},
  {key:"satMorning",title:"토요일 오전 봉사",start:"10:00"},
  {key:"satEvening",title:"토요일 저녁 봉사",start:"18:00"}
];

const peopleEl = document.getElementById("people");
const scheduleEl = document.getElementById("schedule");
const noticeEl = document.getElementById("notice");
const messageEl = document.getElementById("message");

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"
    }[c];
  });
}

function readControls(){
  selected.wed = document.getElementById("wed").checked;
  selected.satMorning = document.getElementById("satMorning").checked;
  selected.satEvening = document.getElementById("satEvening").checked;
}

function getData(){
  readControls();
  return {
   title:"전시대 순환봉사 배정표",
    people:people.map(function(p){
      return {name:p.name,group:p.group};
    }),
    selected:{
      wed:selected.wed,
      satMorning:selected.satMorning,
      satEvening:selected.satEvening
    },
    notice:noticeEl.value
  };
}

function loadData(data){
  if(!data || typeof data!=="object") return;

  if(Array.isArray(data.people)){
    people = Array.from({length:12},function(_,i){
      const p = data.people[i] || {};
      const group = String(p.group || "1");
      return {
        name:String(p.name || ""),
        group:["1","2","3","4"].includes(group)?group:"1"
      };
    });
  }

  if(data.selected){
    selected = {
      wed:data.selected.wed!==false,
      satMorning:data.selected.satMorning!==false,
      satEvening:data.selected.satEvening!==false
    };
  }

  noticeEl.value = String(data.notice || "");
}

function loadInitialData(){
  try{
    const params = new URLSearchParams(location.search);
    const encoded = params.get("data");
    if(encoded){
      const json = decodeURIComponent(escape(atob(encoded)));
      loadData(JSON.parse(json));
      return;
    }
  }catch(e){}

  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) loadData(JSON.parse(saved));
  }catch(e){}
}

function saveQuietly(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(getData()));
  }catch(e){}
}

function renderPeople(){
  peopleEl.innerHTML="";

  people.forEach(function(p,i){
    const row = document.createElement("div");
    row.className="person";

    const nameInput = document.createElement("input");
    nameInput.type="text";
    nameInput.maxLength=30;
    nameInput.placeholder="참여자 "+(i+1)+" 이름";
    nameInput.setAttribute("aria-label","참여자 "+(i+1)+" 이름");
    nameInput.value=p.name;

    nameInput.addEventListener("input",function(){
      people[i].name=nameInput.value;
      renderSchedule();
      saveQuietly();
    });

    const groupSelect = document.createElement("select");
    groupSelect.setAttribute("aria-label","참여자 "+(i+1)+" 조 선택");
    groupSelect.innerHTML=
      '<option value="1">1조</option>'+
      '<option value="2">2조</option>'+
      '<option value="3">3조</option>'+
      '<option value="4">4조</option>';
    groupSelect.value=p.group;

    groupSelect.addEventListener("change",function(){
      people[i].group=groupSelect.value;
      renderSchedule();
      saveQuietly();
    });

    row.appendChild(nameInput);
    row.appendChild(groupSelect);
    peopleEl.appendChild(row);
  });
}

function roleFor(group,step){
  const rotation=[
    ["A","street","B","rest"],
    ["street","B","rest","A"],
    ["B","rest","A","street"],
    ["rest","A","street","B"]
  ];
  return rotation[step%rotation.length][group-1];
}

function roleName(role){
  if(role==="A") return "A 전시대";
  if(role==="B") return "B 전시대";
  if(role==="street") return "가두봉사";
  return "휴식";
}

function roleClass(role){
  if(role==="street") return "street";
  if(role==="rest") return "rest";
  return "";
}

function timeAt(start,step){
  const parts=start.split(":");
  const total=Number(parts[0])*60+Number(parts[1])+step*15;
  const h=String(Math.floor(total/60)%24).padStart(2,"0");
  const m=String(total%60).padStart(2,"0");
  return h+":"+m;
}

function groupNames(group){
  const names=people.filter(function(p){
    return Number(p.group)===group && p.name.trim();
  });

  if(!names.length) return "이름 미입력";

  return names.map(function(p){
    return escapeHTML(p.name.trim());
  }).join(", ");
}

function renderSchedule(){
  readControls();
  scheduleEl.innerHTML="";

  const chosen=sessions.filter(function(s){
    return selected[s.key];
  });

  if(chosen.length===0){
    scheduleEl.innerHTML=
      '<p class="small">봉사 종류를 하나 이상 선택해 주세요.</p>';
    return;
  }

  chosen.forEach(function(session){
    const section=document.createElement("section");
    const heading=document.createElement("h3");
    heading.textContent=session.title+" ("+session.start+" 시작)";
    section.appendChild(heading);

    let html=
      '<div class="table-wrap"><table><thead><tr>'+
      '<th>시간</th><th>1조</th><th>2조</th><th>3조</th><th>4조</th>'+
      '</tr></thead><tbody>';

    for(let step=0;step<8;step++){
      html+='<tr><td>'+timeAt(session.start,step)+
        '<br>~'+timeAt(session.start,step+1)+'</td>';

      for(let group=1;group<=4;group++){
        const role=roleFor(group,step);
        html+='<td><span class="tag '+roleClass(role)+'">'+
          roleName(role)+'</span><span class="member-names">'+
          groupNames(group)+'</span></td>';
      }

      html+='</tr>';
    }

    html+='</tbody></table></div>';
    section.insertAdjacentHTML("beforeend",html);
    scheduleEl.appendChild(section);
  });
}

function refresh(){
  renderSchedule();
  saveQuietly();
}

["wed","satMorning","satEvening"].forEach(function(id){
  document.getElementById(id).addEventListener("change",refresh);
});

noticeEl.addEventListener("input",saveQuietly);

document.getElementById("saveBtn").addEventListener("click",function(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(getData()));
    messageEl.textContent="저장했습니다.";
  }catch(e){
    messageEl.textContent="저장하지 못했습니다. 브라우저 설정을 확인해 주세요.";
  }
});

document.getElementById("shareBtn").addEventListener("click",function(){
  try{
    const data=getData();
    const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const url=location.href.split("?")[0]+"?data="+encodeURIComponent(encoded);

    document.getElementById("shareUrl").value=url;
    document.getElementById("shareArea").classList.remove("hidden");
    messageEl.textContent="「오늘의 전시대 순환봉사 배정표」 공유 링크를 만들었습니다.";
  }catch(e){
    messageEl.textContent="공유 링크를 만들지 못했습니다.";
  }
});

document.getElementById("copyBtn").addEventListener("click",async function(){
  const field=document.getElementById("shareUrl");

  try{
    await navigator.clipboard.writeText(field.value);
    messageEl.textContent="링크를 복사했습니다. 카카오톡에 붙여넣으세요.";
  }catch(e){
    field.focus();
    field.select();
    try{
      document.execCommand("copy");
      messageEl.textContent="링크를 복사했습니다.";
    }catch(err){
      messageEl.textContent="링크를 선택해 복사해 주세요.";
    }
  }
});

document.getElementById("printBtn").addEventListener("click",function(){
  window.print();
});

loadInitialData();

document.getElementById("wed").checked=selected.wed;
document.getElementById("satMorning").checked=selected.satMorning;
document.getElementById("satEvening").checked=selected.satEvening;

renderPeople();
renderSchedule();

})();
</script>
</body>
</html>

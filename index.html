/* =================================================
   변수
================================================= */

let subject="";
let quiz=[];
let index=0;
let score=0;
let wrongList=[];


/* =================================================
   화면
================================================= */

function hideAll(){

 document.querySelectorAll(
 "#home,#subjectPage,#quiz,#result,#wrongPage,#statsPage"
 ).forEach(x=>x.classList.add("hidden"));

}

function goHome(){

 hideAll();

 document.getElementById("home")
 .classList.remove("hidden");

}


/* =================================================
   과목
================================================= */

function chooseSubject(s){

 subject=s;

 document.getElementById("subjectTitle")
 .textContent="📚 "+s;

 hideAll();

 document.getElementById("subjectPage")
 .classList.remove("hidden");

}


function startSubject(){

 quiz=[...BANK[subject]];

 startQuiz();

}


function randomSubject(){

 quiz=shuffle([...BANK[subject]])
 .slice(0,Math.min(20,BANK[subject].length));

 startQuiz();

}


/* =================================================
   랜덤 20
================================================= */

function random20(){

 const subjects=Object.keys(BANK);

 let all=[];

 subjects.forEach(s=>{

  BANK[s].forEach(q=>{

   all.push({
    ...q,
    subject:s
   });

  });

 });

 quiz=shuffle(all).slice(0,20);

 subject="🎲 랜덤 20";

 startQuiz();

}


/* =================================================
   모의고사
================================================= */

function mockExam(){

 let all=[];

 Object.keys(BANK).forEach(s=>{

  BANK[s].forEach(q=>{

   all.push({
    ...q,
    subject:s
   });

  });

 });

 quiz=shuffle(all).slice(
  0,
  Math.min(100,all.length)
 );

 subject="📝 모의고사";

 startQuiz();

}


/* =================================================
   시험 시작
================================================= */

function startQuiz(){

 index=0;
 score=0;
 wrongList=[];

 hideAll();

 document.getElementById("quiz")
 .classList.remove("hidden");

 render();

}


/* =================================================
   문제 표시
================================================= */

function render(){

 const q=quiz[index];

 document.getElementById("subjectName")
 .textContent=q.subject||subject;

 document.getElementById("questionCount")
 .textContent=
 (index+1)+" / "+quiz.length;

 document.getElementById("bar")
 .style.width=
 ((index+1)/quiz.length*100)+"%";

 document.getElementById("question")
 .textContent=q.q;

 const box=
 document.getElementById("answers");

 box.innerHTML="";

 q.a.forEach((text,i)=>{

  const b=
  document.createElement("button");

  b.className="answer";

  b.textContent=
  (i+1)+". "+text;

  b.onclick=()=>{
   answer(i,b);
  };

  box.appendChild(b);

 });

 document.getElementById("explain")
 .classList.add("hidden");

 document.getElementById("next")
 .classList.add("hidden");

 renderNumbers();

}


/* =================================================
   번호
================================================= */

function renderNumbers(){

 const box=
 document.getElementById("numbers");

 box.innerHTML="";

 quiz.forEach((q,i)=>{

  const b=
  document.createElement("button");

  b.className="num";

  b.textContent=i+1;

  if(i<index)
   b.classList.add("done");

  if(
   wrongList.some(x=>x.index===i)
  )
   b.classList.add("bad");

  b.onclick=()=>{

   if(i<=index){

    index=i;
    render();

   }

  };

  box.appendChild(b);

 });

}


/* =================================================
   정답
================================================= */

function answer(selected,button){

 const q=quiz[index];

 const all=
 document.querySelectorAll(".answer");

 all.forEach((b,i)=>{

  b.disabled=true;

  if(i===q.ans)
   b.classList.add("correct");

 });

 if(selected===q.ans){

  score++;

 }else{

  button.classList.add("wrong");

  wrongList.push({
   index:index,
   q:q,
   selected:selected
  });

  saveWrong(q,selected);

 }

 document.getElementById("explain")
 .innerHTML=
 "<b>📖 해설</b><br><br>"+
 q.ex;

 document.getElementById("explain")
 .classList.remove("hidden");

 document.getElementById("next")
 .classList.remove("hidden");

 renderNumbers();

}


/* =================================================
   다음
================================================= */

function nextQuestion(){

 if(index<quiz.length-1){

  index++;

  render();

  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

 }else{

  finish();

 }

}


/* =================================================
   결과
================================================= */

function finish(){

 saveStats();

 hideAll();

 document.getElementById("result")
 .classList.remove("hidden");

 const total=quiz.length;

 const percent=
 Math.round(score/total*100);

 document.getElementById("score")
 .textContent=percent+"점";

 document.getElementById("total")
 .textContent=total;

 document.getElementById("correct")
 .textContent=score;

 document.getElementById("wrong")
 .textContent=total-score;

}


/* =================================================
   다시
================================================= */

function restart(){

 startQuiz();

}


/* =================================================
   오답 저장
================================================= */

function saveWrong(q,selected){

 let list=
 JSON.parse(
 localStorage.getItem("electricWrong")||"[]"
 );

 if(
 !list.some(x=>x.q===q.q)
 ){

  list.push({
   subject:q.subject||subject,
   q:q.q,
   a:q.a,
   ans:q.ans,
   selected:selected,
   ex:q.ex
  });

 }

 localStorage.setItem(
 "electricWrong",
 JSON.stringify(list)
 );

}


/* =================================================
   오답 보기
================================================= */

function showWrong(){

 hideAll();

 document.getElementById("wrongPage")
 .classList.remove("hidden");

 const box=
 document.getElementById("wrongList");

 const list=
 JSON.parse(
 localStorage.getItem("electricWrong")||"[]"
 );

 box.innerHTML="";

 if(list.length===0){

  box.innerHTML=
  "<p style='text-align:center;padding:25px;color:#777'>"+
  "아직 오답이 없습니다.<br>문제를 풀어보세요.</p>";

  return;

 }

 list.forEach((x,i)=>{

  box.innerHTML+=`

  <div class="wrongItem">

  <b>${i+1}. ${x.subject}</b>

  <br><br>

  ${x.q}

  <br><br>

  ❌ 내 답: ${x.selected+1}번

  <br>

  ✅ 정답: ${x.ans+1}번

  <br><br>

  📖 ${x.ex}

  </div>

  `;

 });

}


/* =================================================
   오답 다시
================================================= */

function retryWrong(){

 const list=
 JSON.parse(
 localStorage.getItem("electricWrong")||"[]"
 );

 if(!list.length){

  alert("오답이 없습니다.");

  return;

 }

 quiz=list.map(x=>({
  q:x.q,
  a:x.a,
  ans:x.ans,
  ex:x.ex,
  subject:x.subject
 }));

 subject="❌ 오답노트";

 startQuiz();

}


/* =================================================
   오답 삭제
================================================= */

function clearWrong(){

 if(
 confirm("오답노트를 모두 삭제할까요?")
 ){

  localStorage.removeItem(
   "electricWrong"
  );

  showWrong();

 }

}


/* =================================================
   학습현황
================================================= */

function saveStats(){

 if(subject.includes("랜덤")||
    subject.includes("모의고사")||
    subject.includes("오답"))
 return;

 let data=
 JSON.parse(
 localStorage.getItem("electricStats")||"{}"
 );

 if(!data[subject])
 data[subject]={
  total:0,
  correct:0,
  wrong:0
 };

 data[subject].total+=quiz.length;
 data[subject].correct+=score;
 data[subject].wrong+=quiz.length-score;

 localStorage.setItem(
  "electricStats",
  JSON.stringify(data)
 );

}


function showStats(){

 hideAll();

 document.getElementById("statsPage")
 .classList.remove("hidden");

 const data=
 JSON.parse(
 localStorage.getItem("electricStats")||"{}"
 );

 let total=0;
 let correct=0;
 let wrong=0;

 const box=
 document.getElementById("subjectStats");

 box.innerHTML="";

 Object.keys(data).forEach(s=>{

  const x=data[s];

  total+=x.total;
  correct+=x.correct;
  wrong+=x.wrong;

  const p=
  x.total
  ?Math.round(x.correct/x.total*100)
  :0;

  box.innerHTML+=`

  <div class="subjectStat">

  <b>${s}</b>

  <br>

  풀이 ${x.total}문제
  · 정답 ${x.correct}
  · 오답 ${x.wrong}

  <br>

  정답률 ${p}%

  <div class="progress">
  <div style="width:${p}%"></div>
  </div>

  </div>

  `;

 });

 document.getElementById("stTotal")
 .textContent=total;

 document.getElementById("stCorrect")
 .textContent=correct;

 document.getElementById("stWrong")
 .textContent=wrong;

}


/* =================================================
   배열 섞기
================================================= */

function shuffle(arr){

 for(let i=arr.length-1;i>0;i--){

  const j=
  Math.floor(Math.random()*(i+1));

  [arr[i],arr[j]]=
  [arr[j],arr[i]];

 }

 return arr;

}

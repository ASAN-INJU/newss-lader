```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1f5eff">

<title>수요일·토요일 전시대 봉사표</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f6fb;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#172033;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:10px;
}

h1{
  font-size:27px;
  text-align:center;
  margin:8px 0 14px;
}

/* 요일 버튼 */
.day-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.day-buttons button{
  border:0;
  border-radius:12px;
  padding:15px 8px;
  font-size:21px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.wed{
  background:#1769e0;
}

.sat{
  background:#16a05d;
}

.day-buttons button.active{
  box-shadow:0 0 0 4px #ffd400;
  transform:scale(1.02);
}

/* 카드 */
.card{
  background:white;
  border:2px solid #222;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001;
}

h2{
  font-size:21px;
  margin:0 0 12px;
}

/* 조 편성 */
.team{
  display:grid;
  grid-template-columns:58px 1fr 1fr 1fr;
  gap:6px;
  align-items:center;
  margin-bottom:8px;
}

.team b{
  font-size:18px;
  text-align:center;
}

input{
  width:100%;
  padding:12px 7px;
  font-size:17px;
  border:2px solid #aaa;
  border-radius:8px;
  min-width:0;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:18px;
  font-weight:bold;
  background:#1f5eff;
  color:white;
}

.btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.reset{
  background:#555;
}

.small{
  font-size:14px;
  color:#555;
  margin:7px 0 0;
}

/* 표 */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  border:2px solid #222;
  padding:10px 3px;
  text-align:center;
  font-size:16px;
}

th{
  background:#e9eef8;
  font-size:14px;
}

.time{
  font-weight:bold;
  white-space:nowrap;
}

.place{
  font-weight:bold;
}

/* 조별 색상 */
.group1{
  background:#fff2a8;
}

.group2{
  background:#cce8ff;
}

.group3{
  background:#d8f5d0;
}

.group4{
  background:#ffd6e7;
}

.current-day{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  background:#eef3ff;
}

/* 휴대폰 */
@media(max-width:520px){

  .wrap{
    padding:7px;
  }

  h1{
    font-size:24px;
  }

  .day-buttons button{
    font-size:20px;
    padding:14px 5px;
  }

  .card{
    padding:9px;
  }

  h2{
    font-size:20px;
  }

  .team{
    grid-template-columns:50px 1fr 1fr 1fr;
    gap:4px;
  }

  .team b{
    font-size:15px;
  }

  input{
    font-size:15px;
    padding:10px 4px;
  }

  th,td{
    font-size:13px;
    padding:9px 2px;
  }

  th{
    font-size:11px;
  }

  .time{
    font-size:12px;
  }

  .place{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>📋 전시대 봉사표</h1>

<!-- 요일 선택 -->
<div class="day-buttons">

  <button id="wedBtn"
          class="wed active"
          onclick="changeDay('wed')">
    🟦 수요일
  </button>

  <button id="satBtn"
          class="sat"
          onclick="changeDay('sat')">
    🟩 토요일
  </button>

</div>

<div class="current-day" id="currentDay">
  🟦 수요일 전시대 봉사표
</div>

<!-- 조 편성 -->
<div class="card">

<h2>① 조 편성</h2>

<div class="team">
<b>1조</b>
<input id="g11" placeholder="이름">
<input id="g12" placeholder="이름">
<input id="g13" placeholder="이름">
</div>

<div class="team">
<b>2조</b>
<input id="g21" placeholder="이름">
<input id="g22" placeholder="이름">
<input id="g23" placeholder="이름">
</div>

<div class="team">
<b>3조</b>
<input id="g31" placeholder="이름">
<input id="g32" placeholder="이름">
<input id="g33" placeholder="이름">
</div>

<div class="team">
<b>4조</b>
<input id="g41" placeholder="이름">
<input id="g42" placeholder="이름">
<input id="g43" placeholder="이름">
</div>

<div class="btns">

<button onclick="save()">
💾 이름 저장
</button>

<button class="reset" onclick="resetNames()">
↺ 이름 지우기
</button>

</div>

<p class="small">
※ 2명만 근무하는 조는 세 번째 칸을 비워두세요.
</p>

</div>


<!-- 로테이션 -->
<div class="card">

<h2>② 15분 봉사 로테이션</h2>

<table>

<thead>

<tr>
<th>시간</th>
<th>전시대</th>
<th>만득이</th>
<th>면사무소<br>건너 정류장</th>
<th>면사무소<br>정류장</th>
</tr>

</thead>

<tbody id="schedule"></tbody>

</table>

</div>

</div>


<script>

/* 현재 선택한 요일 */
let currentDay = "wed";


/* 15분 로테이션 */
const slots = [

["06:00~06:15",[1,2,3,4]],

["06:15~06:30",[4,1,2,3]],

["06:30~06:45",[3,4,1,2]],

["06:45~07:00",[2,3,4,1]],

["07:00~07:15",[1,2,3,4]],

["07:15~07:30",[4,1,2,3]],

["07:30~07:45",[3,4,1,2]],

["07:45~08:00",[2,3,4,1]]

];


/* 요일 변경 */
function changeDay(day){

  /* 현재 요일 저장 */
  saveCurrentInputs();

  currentDay = day;

  if(day === "wed"){

    document.getElementById("currentDay").innerHTML =
      "🟦 수요일 전시대 봉사표";

    document.getElementById("wedBtn").classList.add("active");
    document.getElementById("satBtn").classList.remove("active");

  }else{

    document.getElementById("currentDay").innerHTML =
      "🟩 토요일 전시대 봉사표";

    document.getElementById("satBtn").classList.add("active");
    document.getElementById("wedBtn").classList.remove("active");

  }

  load();

}


/* 저장 키 만들기 */
function key(n,i){

  return currentDay + "_g" + n + i;

}


/* 현재 입력값 저장 */
function saveCurrentInputs(){

  for(let n=1;n<=4;n++){

    for(let i=1;i<=3;i++){

      const input =
        document.getElementById("g"+n+i);

      localStorage.setItem(
        key(n,i),
        input.value
      );

    }

  }

}


/* 조 이름 표시 */
function groupName(n){

  let a=[];

  for(let i=1;i<=3;i++){

    const v =
      document.getElementById("g"+n+i).value.trim();

    if(v){
      a.push(v);
    }

  }

  if(a.length){

    return n+"조<br><small>"
      +a.join(" · ")
      +"</small>";

  }

  return n+"조";

}


/* 표 만들기 */
function render(){

  const tb =
    document.getElementById("schedule");

  tb.innerHTML="";

  slots.forEach(s=>{

    const tr =
      document.createElement("tr");

    tr.innerHTML =
      "<td class='time'>"
      +s[0]
      +"</td>"
      +
      s[1].map(n=>

        "<td class='place group"
        +n+
        "'>"
        +groupName(n)
        +"</td>"

      ).join("");

    tb.appendChild(tr);

  });

}


/* 이름 저장 */
function save(){

  saveCurrentInputs();

  render();

  alert(
    currentDay === "wed"
    ? "수요일 이름이 저장되었습니다."
    : "토요일 이름이 저장되었습니다."
  );

}


/* 이름 불러오기 */
function load(){

  for(let n=1;n<=4;n++){

    for(let i=1;i<=3;i++){

      const input =
        document.getElementById("g"+n+i);

      const v =
        localStorage.getItem(key(n,i));

      input.value =
        v !== null ? v : "";

    }

  }

  render();

}


/* 이름 지우기 */
function resetNames(){

  const dayName =
    currentDay === "wed"
    ? "수요일"
    : "토요일";

  if(
    confirm(
      dayName+
      " 입력한 이름만 모두 지울까요?"
    )
  ){

    for(let n=1;n<=4;n++){

      for(let i=1;i<=3;i++){

        document.getElementById(
          "g"+n+i
        ).value="";

        localStorage.removeItem(
          key(n,i)
        );

      }

    }

    render();

  }

}


/* 입력 즉시 표에 반영 */
document
.querySelectorAll("input")
.forEach(x=>{

  x.addEventListener(
    "input",
    render
  );

});


/* 처음에는 수요일 */
load();

</script>

</body>
</html>
```
